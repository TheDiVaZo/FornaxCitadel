# Manual acid activation; see docs/acid-blocks.md for configuration and integration rules.
acid:
  enabled: true
  activation:
    max-distance: 5
  drops:
    target-block: true
    target-reinforcement: false
    acid-block: false
    acid-reinforcement: true
  # Types are determined by the reinforced block's material, not reinforcement item.
  # After restart these values also apply to existing blocks. No targets means no consumption.
  types:
    gold:
      enabled: true
      material: GOLD_BLOCK
      max-targets: 1
      maturation-multiplier: 2.0
    diamond:
      enabled: true
      material: DIAMOND_BLOCK
      max-targets: 2
      maturation-multiplier: 3.0
    netherite:
      enabled: true
      material: NETHERITE_BLOCK
      max-targets: 6
      maturation-multiplier: 4.0

# Queue work is performed once per server tick on the main thread.
actions:
  max-per-tick: 1024

# Copies dirty core data into loaded chunks' PDC. Minecraft saves PDC to disk
# with the chunk; this interval is not a disk durability guarantee.
storage:
  save-interval-ticks: 1200

# Systems process all observed citadels at this interval. Discovery updates after cell/data changes.
observation:
  interval-ticks: 1
  full-3d:
    # Inclusive radii around the player's 16x16x16 cell: 3 includes seven cells per axis.
    horizontal-radius-chunks: 3
    vertical-radius-sections: 3

# Ordinary player hits start at 1 damage before applying player-specific modifiers.
player-damage:
  # Creative hits remove any reinforcement, including invulnerable types, and break the block.
  # Permissions and protection validators still apply. False uses ordinary damage rules.
  creative-mode: true
  newcomers:
    enabled: false
    # Damage grows from 10% to 100%; reaching either threshold restores full damage.
    first-join-hours: 48
    play-time-hours: 12

# Dismantling removes the owner's reinforcement and preserves the targeted block.
dismantle:
  # Chance to return one stored reinforcement item when dismantling a damaged citadel.
  # Full health or no Health component always returns the item, even when this chance is 0.
  # Applies to survival, creative and command placements alike.
  refund-chance: 0.5

# Entity power comes from ExplosionPrimeEvent; this value is its fallback.
explosions:
  default-entity-power: 4.0
  default-block-power: 4.0
  # Defaults for beds and respawn anchors. Other materials can be added.
  block-powers:
    RESPAWN_ANCHOR: 5.0
    STRAW_BED: 5.0
    WHITE_BED: 5.0
    ORANGE_BED: 5.0
    MAGENTA_BED: 5.0
    LIGHT_BLUE_BED: 5.0
    YELLOW_BED: 5.0
    LIME_BED: 5.0
    PINK_BED: 5.0
    GRAY_BED: 5.0
    LIGHT_GRAY_BED: 5.0
    CYAN_BED: 5.0
    PURPLE_BED: 5.0
    BLUE_BED: 5.0
    BROWN_BED: 5.0
    GREEN_BED: 5.0
    RED_BED: 5.0
    BLACK_BED: 5.0

# Item keys default to the minecraft namespace when omitted.
# External providers register their own namespace (e.g. otherplugin:reinforcement).
# Materials are resolved on use; providers may register after FornaxCitadel enables.
# Every type requires a positive integer lvl; existing citadels use the current configured level.
# item applies to placement, repair and reinforcement refunds, including previously placed citadels.
# damage-policy defaults to allow; deny blocks ordinary damage from every source.
# Authorized creative destruction and administrative removal can still remove these types.
# health.max is read from current settings; only actual HP is stored in a citadel.
# Reducing max never changes HP on load: 80/50 becomes 49/50 only when taking 1 damage.
# Increasing max does not heal. Maturing amplifies ordinary damage from every source.
# Only placement time is stored; current maturation settings apply to existing citadels too.
# Missing maturing or duration-seconds: 0 means instant maturity, including acid blocks.
# Duration is a non-negative whole number of seconds. Changes take effect after restart.
citadel-types:
  reinforced_light:
    item: minecraft:copper_ingot
    lvl: 1
    health:
      max: 10.0
  reinforced:
    item: minecraft:iron_ingot
    lvl: 2
    health:
      max: 20.0
  reinforced_heavy:
    item: minecraft:diamond
    lvl: 3
    health:
      max: 30.0
  maturing_fast:
    item: minecraft:amethyst_shard
    lvl: 2
    health:
      max: 20.0
    maturing:
      duration-seconds: 300
      initial-damage-multiplier: 2.0
  maturing:
    item: minecraft:emerald
    lvl: 4
    health:
      max: 40.0
    maturing:
      duration-seconds: 600
      initial-damage-multiplier: 4.0
  maturing_strong:
    item: minecraft:netherite_ingot
    lvl: 5
    health:
      max: 80.0
    maturing:
      duration-seconds: 1800
      initial-damage-multiplier: 4.0
  invulnerable:
    item: minecraft:nether_star
    lvl: 999
    # Invulnerable types require administrator permission to install.
    damage-policy: deny

placement:
  # Solid blocks only; pistons and piston parts are always rejected.
  block-list:
    # WHITELIST permits only listed materials; BLACKLIST permits everything except them.
    type: BLACKLIST
    # Uses material registry identities. Plugin materials use their own namespace, e.g. otherplugin:stone.
    blocks: []
