# Queue work is performed once per server tick on the main thread.
actions:
  max-per-tick: 1024

# Copies dirty core data into loaded chunks' PDC. Minecraft saves PDC to disk
# with the chunk; this interval is not a disk durability guarantee.
storage:
  save-interval-ticks: 1200

# Systems process all observed citadels at this interval. Discovery updates after cell/data changes.
observation:
  interval-ticks: 1
  full-3d:
    # Inclusive radii around the player's 16x16x16 cell: 3 includes seven cells per axis.
    horizontal-radius-chunks: 3
    vertical-radius-sections: 3

# Ordinary player hits start at 1 damage before applying player-specific modifiers.
player-damage:
  # Creative hits remove any reinforcement, including invulnerable types, and keep the block.
  # Permissions and protection validators still apply. False uses ordinary damage rules.
  creative-mode: true
  newcomers:
    enabled: false
    # Damage grows from 10% to 100%; reaching either threshold restores full damage.
    first-join-hours: 48
    play-time-hours: 12

# Entity power comes from ExplosionPrimeEvent; this value is its fallback.
explosions:
  default-entity-power: 4.0
  default-block-power: 4.0
  # Defaults for beds and respawn anchors. Other materials can be added.
  block-powers:
    RESPAWN_ANCHOR: 5.0
    STRAW_BED: 5.0
    WHITE_BED: 5.0
    ORANGE_BED: 5.0
    MAGENTA_BED: 5.0
    LIGHT_BLUE_BED: 5.0
    YELLOW_BED: 5.0
    LIME_BED: 5.0
    PINK_BED: 5.0
    GRAY_BED: 5.0
    LIGHT_GRAY_BED: 5.0
    CYAN_BED: 5.0
    PURPLE_BED: 5.0
    BLUE_BED: 5.0
    BROWN_BED: 5.0
    GREEN_BED: 5.0
    RED_BED: 5.0
    BLACK_BED: 5.0

# Item keys default to the minecraft namespace when omitted.
# External providers register their own namespace (e.g. otherplugin:reinforcement).
# Materials are resolved on use; providers may register after FornaxCitadel enables.
# damage-policy defaults to allow; deny blocks ordinary damage from every source.
# Authorized creative destruction and administrative removal can still remove these types.
citadel-types:
  reinforced_light:
    item: minecraft:copper_ingot
    health:
      behavior: simple
      max: 10.0
  reinforced:
    item: minecraft:iron_ingot
    health:
      behavior: simple
      max: 20.0
  reinforced_heavy:
    item: minecraft:diamond
    health:
      behavior: simple
      max: 30.0
  maturing_fast:
    item: minecraft:amethyst_shard
    health:
      behavior: maturing
      initial: 10.0
      mature: 20.0
      duration-seconds: 300
  maturing:
    item: minecraft:emerald
    health:
      behavior: maturing
      initial: 10.0
      mature: 40.0
      duration-seconds: 600
  maturing_strong:
    item: minecraft:netherite_ingot
    health:
      behavior: maturing
      initial: 20.0
      mature: 80.0
      duration-seconds: 1800
  invulnerable:
    item: minecraft:nether_star
    # Invulnerable types require administrator permission to install.
    damage-policy: deny

placement:
  # Solid blocks only; pistons and piston parts are always rejected.
  block-list:
    # WHITELIST permits only listed materials; BLACKLIST permits everything except them.
    type: WHITELIST
    # Uses material registry identities. Plugin materials use their own namespace, e.g. otherplugin:stone.
    blocks:
      - minecraft:stone
      - minecraft:cobblestone
      - minecraft:stone_bricks
      - minecraft:deepslate
      - minecraft:cobbled_deepslate
      - minecraft:deepslate_bricks
      - minecraft:bricks
      - minecraft:obsidian
      - minecraft:crying_obsidian
      - minecraft:blackstone
      - minecraft:polished_blackstone
      - minecraft:nether_bricks
      - minecraft:end_stone
      - minecraft:iron_block
      - minecraft:gold_block
      - minecraft:diamond_block
      - minecraft:emerald_block
      - minecraft:netherite_block
